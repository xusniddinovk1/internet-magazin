<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mahsulot</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #f7f5f0;
        --bg2: #ffffff;
        --bg3: #f0ede6;
        --text: #1a1814;
        --text-muted: #7a7568;
        --accent: #2c2c2c;
        --gold: #b8860b;
        --gold-light: #f5edd0;
        --border: #e2ddd4;
        --radius: 12px;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: "DM Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }

      /* NOT FOUND */
      #notFound {
        display: none;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        text-align: center;
        padding: 40px;
      }
      #notFound h2 {
        font-family: "Instrument Serif", serif;
        font-size: 32px;
        color: var(--text);
      }
      #notFound p {
        color: var(--text-muted);
        font-size: 15px;
      }

      /* MAIN */
      #mainContent {
        display: none;
      }

      /* HERO IMAGE */
      .hero {
        width: 100%;
        height: clamp(280px, 45vw, 480px);
        position: relative;
        overflow: hidden;
        background: var(--bg3);
      }

      .hero img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .hero-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          transparent 50%,
          rgba(247, 245, 240, 0.9) 100%
        );
      }

      /* BACK BUTTON */
      .back-btn {
        position: absolute;
        top: 16px;
        left: 16px;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid var(--border);
        border-radius: 100px;
        padding: 8px 16px 8px 12px;
        font-family: "DM Sans", sans-serif;
        font-size: 13px;
        color: var(--text);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        backdrop-filter: blur(8px);
        text-decoration: none;
        transition: background 0.2s;
      }
      .back-btn:hover {
        background: white;
      }
      .back-btn svg {
        width: 16px;
        height: 16px;
      }

      /* CONTENT */
      .content {
        max-width: 560px;
        margin: 0 auto;
        padding: 0 20px 60px;
      }

      /* PRODUCT INFO */
      .product-info {
        padding: 28px 0 32px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 32px;
        animation: fadeUp 0.5s ease both;
      }

      .category-tag {
        display: inline-block;
        background: var(--gold-light);
        color: var(--gold);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        padding: 5px 12px;
        border-radius: 100px;
        margin-bottom: 14px;
      }

      .product-name {
        font-family: "Instrument Serif", serif;
        font-size: clamp(30px, 7vw, 42px);
        font-weight: 400;
        line-height: 1.15;
        margin-bottom: 8px;
        color: var(--text);
      }

      .product-short {
        font-size: 15px;
        color: var(--text-muted);
        margin-bottom: 20px;
        font-style: italic;
      }

      .product-price {
        font-size: 26px;
        font-weight: 500;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .price-label {
        font-size: 12px;
        font-weight: 400;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      /* DESCRIPTION */
      .section {
        margin-bottom: 28px;
        animation: fadeUp 0.5s ease 0.1s both;
      }

      .section-title {
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 10px;
      }

      .description {
        font-size: 15px;
        line-height: 1.75;
        color: var(--text);
      }

      /* FEATURES */
      .features {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 4px;
      }

      .feature-tag {
        background: var(--bg3);
        border: 1px solid var(--border);
        border-radius: 100px;
        padding: 6px 14px;
        font-size: 13px;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .feature-tag::before {
        content: "";
        width: 5px;
        height: 5px;
        background: var(--gold);
        border-radius: 50%;
        flex-shrink: 0;
      }

      /* DIVIDER */
      .form-divider {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 36px 0 28px;
      }
      .form-divider::before,
      .form-divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }
      .form-divider span {
        font-size: 12px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--text-muted);
        white-space: nowrap;
      }

      /* FORM */
      .form-wrap {
        animation: fadeUp 0.5s ease 0.2s both;
      }

      .form-header {
        margin-bottom: 24px;
      }

      .form-header h3 {
        font-family: "Instrument Serif", serif;
        font-size: 24px;
        font-weight: 400;
        margin-bottom: 4px;
      }

      .form-header p {
        font-size: 13px;
        color: var(--text-muted);
      }

      .field {
        margin-bottom: 16px;
      }

      label {
        display: block;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 7px;
      }

      input {
        width: 100%;
        background: var(--bg2);
        border: 1.5px solid var(--border);
        border-radius: var(--radius);
        padding: 13px 16px;
        font-family: "DM Sans", sans-serif;
        font-size: 15px;
        color: var(--text);
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
        -webkit-appearance: none;
      }

      input::placeholder {
        color: #c0bab0;
      }

      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(44, 44, 44, 0.06);
      }

      .btn {
        width: 100%;
        background: var(--accent);
        border: none;
        border-radius: var(--radius);
        padding: 15px;
        font-family: "DM Sans", sans-serif;
        font-size: 15px;
        font-weight: 500;
        color: white;
        cursor: pointer;
        margin-top: 8px;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .btn:hover {
        background: #111;
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
      }
      .btn:active {
        transform: translateY(0);
        box-shadow: none;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .btn svg {
        width: 18px;
        height: 18px;
        transition: transform 0.2s;
      }
      .btn:hover svg {
        transform: translateX(3px);
      }

      .spinner {
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .error-msg {
        display: none;
        background: #fef0f0;
        border: 1px solid #fccaca;
        border-radius: 8px;
        color: #c53030;
        font-size: 13px;
        padding: 10px 14px;
        margin-top: 12px;
        text-align: center;
      }

      /* SUCCESS */
      .success-state {
        display: none;
        text-align: center;
        padding: 32px 20px;
        background: var(--bg2);
        border: 1.5px solid var(--border);
        border-radius: 20px;
      }

      .success-check {
        width: 60px;
        height: 60px;
        background: #f0faf4;
        border: 1.5px solid #86efac;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 18px;
        font-size: 26px;
      }

      .success-title {
        font-family: "Instrument Serif", serif;
        font-size: 24px;
        margin-bottom: 8px;
        color: var(--text);
      }

      .success-text {
        font-size: 14px;
        color: var(--text-muted);
        line-height: 1.6;
      }

      /* ANIMATIONS */
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .hero {
        animation: fadeUp 0.4s ease both;
      }

      @media (max-width: 480px) {
        .content {
          padding: 0 16px 48px;
        }
      }
    </style>
  </head>
  <body>
    <!-- NOT FOUND -->
    <div id="notFound" style="display: none; flex-direction: column">
      <div style="font-size: 48px">🔍</div>
      <h2>Mahsulot topilmadi</h2>
      <p>Bu mahsulot mavjud emas yoki o'chirilgan.</p>
    </div>

    <!-- MAIN CONTENT -->
    <div id="mainContent">
      <!-- HERO IMAGE -->
      <div class="hero">
        <img id="productImg" src="" alt="" />
        <div class="hero-overlay"></div>
        <a class="back-btn" href="javascript:history.back()">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M19 12H5M12 5l-7 7 7 7" />
          </svg>
          Orqaga
        </a>
      </div>

      <!-- CONTENT -->
      <div class="content">
        <!-- PRODUCT INFO -->
        <div class="product-info">
          <div class="category-tag">Mahsulot</div>
          <h1 class="product-name" id="productName">—</h1>
          <p class="product-short" id="productShort">—</p>
          <div class="product-price">
            <span class="price-label">Narxi</span>
            <span id="productPrice">—</span>
          </div>
        </div>

        <!-- DESCRIPTION -->
        <div class="section">
          <div class="section-title">Mahsulot haqida</div>
          <p class="description" id="productDesc">—</p>
        </div>

        <!-- FEATURES -->
        <div class="section" id="featuresSection">
          <div class="section-title">Xususiyatlari</div>
          <div class="features" id="featuresList"></div>
        </div>

        <!-- FORM DIVIDER -->
        <div class="form-divider">
          <span>Buyurtma berish</span>
        </div>

        <!-- FORM -->
        <div class="form-wrap">
          <div class="form-header">
            <h3>Ma'lumotlaringizni kiriting</h3>
            <p>Tez orada siz bilan bog'lanamiz</p>
          </div>

          <div id="formContent">
            <div class="field">
              <label for="fname">Ism</label>
              <input
                type="text"
                id="fname"
                placeholder="Ismingiz"
                autocomplete="given-name"
              />
            </div>
            <div class="field">
              <label for="lname">Familiya</label>
              <input
                type="text"
                id="lname"
                placeholder="Familiyangiz"
                autocomplete="family-name"
              />
            </div>
            <div class="field">
              <label for="phone">Telefon</label>
              <input
                type="tel"
                id="phone"
                placeholder="+998 90 123 45 67"
                autocomplete="tel"
              />
            </div>

            <button class="btn" id="submitBtn" onclick="sendOrder()">
              <span id="btnText">Buyurtma berish</span>
              <svg
                id="btnArrow"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M5 12h14M12 5l7 7-7 7" />
              </svg>
            </button>

            <div class="error-msg" id="errorMsg"></div>
          </div>

          <!-- SUCCESS -->
          <div class="success-state" id="successState">
            <div class="success-check">✓</div>
            <div class="success-title">Buyurtma qabul qilindi!</div>
            <p class="success-text">
              Rahmat! <strong id="successName"></strong>, tez orada<br />siz
              bilan bog'lanamiz.
            </p>
          </div>
        </div>
      </div>
    </div>

    <script>
      // =============================================
      //  SOZLAMALAR — faqat shu ikki qatorni o'zgartiring
      // =============================================
      const BOT_TOKEN = "8828690268:AAGwq2Hs4eyWG50X2JgG0XYf4eb8nec1Mng";
      const CHAT_ID = "6108249367";
      // =============================================

      let currentProduct = null;

      async function loadProduct() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        if (!id) {
          showNotFound();
          return;
        }

        try {
          const res = await fetch("product.json");
          const data = await res.json();

          if (!data[id]) {
            showNotFound();
            return;
          }

          currentProduct = { id, ...data[id] };
          renderProduct(currentProduct);
        } catch (e) {
          showNotFound();
        }
      }

      function renderProduct(p) {
        document.title = p.name + " — Buyurtma";

        document.getElementById("productImg").src = p.image;
        document.getElementById("productImg").alt = p.name;
        document.getElementById("productName").textContent = p.name;
        document.getElementById("productShort").textContent = p.short;
        document.getElementById("productPrice").textContent = p.price;
        document.getElementById("productDesc").textContent = p.description;

        // Features
        const list = document.getElementById("featuresList");
        if (p.features && p.features.length) {
          p.features.forEach((f) => {
            const tag = document.createElement("div");
            tag.className = "feature-tag";
            tag.textContent = f;
            list.appendChild(tag);
          });
        } else {
          document.getElementById("featuresSection").style.display = "none";
        }

        document.getElementById("mainContent").style.display = "block";
      }

      function showNotFound() {
        document.getElementById("notFound").style.display = "flex";
      }

      async function sendOrder() {
        const fname = document.getElementById("fname").value.trim();
        const lname = document.getElementById("lname").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const btn = document.getElementById("submitBtn");
        const err = document.getElementById("errorMsg");

        err.style.display = "none";

        if (!fname || !lname || !phone) {
          err.textContent = "Iltimos, barcha maydonlarni to'ldiring.";
          err.style.display = "block";
          return;
        }

        if (!/^[\+\d\s\-\(\)]{9,16}$/.test(phone)) {
          err.textContent = "To'g'ri telefon raqam kiriting.";
          err.style.display = "block";
          return;
        }

        // Loading state
        btn.disabled = true;
        document.getElementById("btnText").textContent = "Yuborilmoqda...";
        document.getElementById("btnArrow").style.display = "none";
        const spinner = document.createElement("div");
        spinner.className = "spinner";
        btn.appendChild(spinner);

        const time = new Date().toLocaleString("uz-UZ", {
          timeZone: "Asia/Tashkent",
          dateStyle: "short",
          timeStyle: "short",
        });

        const msg = `🛍 *Yangi buyurtma!*

📦 *Mahsulot:* ${currentProduct.name}
💰 *Narxi:* ${currentProduct.price}

👤 *Ism:* ${fname}
👤 *Familiya:* ${lname}
📞 *Telefon:* ${phone}
🕐 *Vaqt:* ${time}

🔗 ID: \`${currentProduct.id}\``;

        try {
          const res = await fetch(
            `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                chat_id: CHAT_ID,
                text: msg,
                parse_mode: "Markdown",
              }),
            },
          );

          const data = await res.json();

          if (data.ok) {
            document.getElementById("successName").textContent = fname;
            document.getElementById("formContent").style.display = "none";
            document.getElementById("successState").style.display = "block";
          } else {
            throw new Error(data.description);
          }
        } catch (e) {
          err.textContent = "Xatolik yuz berdi. Qaytadan urinib ko'ring.";
          err.style.display = "block";
          btn.disabled = false;
          document.getElementById("btnText").textContent = "Buyurtma berish";
          document.getElementById("btnArrow").style.display = "block";
          spinner.remove();
        }
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendOrder();
      });

      loadProduct();
    </script>
  </body>
</html>
